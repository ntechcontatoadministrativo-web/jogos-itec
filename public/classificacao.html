<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Classificação Geral · Jogos do ITEC</title>
  <meta name="description" content="Classificação geral ao vivo dos V Jogos do ITEC – UFPA.">
  <meta name="theme-color" content="#1b4d33">
  <link rel="icon" href="/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* mesma linguagem da arte oficial: faixas verdes, escudo sobreposto e pontos no círculo */
    :root {
      --verde: #1b4d33; --faixa: #3b5e45; --circulo: #0e3d24; --ouro: #e3a72f;
      --tinta: #12261b; --suave: #5d6e64;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100vh; font-family: 'Barlow', system-ui, sans-serif; color: var(--tinta);
      background-color: #fff;
      background-image: radial-gradient(circle, #e6ebe7 0 7px, transparent 8px);
      background-size: 30px 30px;
      position: relative; overflow-x: hidden;
    }
    body::before, body::after {
      content: ''; position: fixed; width: 0; height: 0; z-index: 0; pointer-events: none;
    }
    body::before { top: 0; left: 0; border-top: 70px solid var(--verde); border-right: 70px solid transparent; }
    body::after { bottom: 0; right: 0; border-bottom: 90px solid var(--verde); border-left: 90px solid transparent; }
    main { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 28px 16px 40px; }
    .cab { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 26px; }
    .cab svg { width: 62px; height: 62px; color: var(--ouro); flex: none; }
    .cab h1 {
      margin: 0; font-family: 'Bebas Neue', Impact, sans-serif; font-weight: 400; color: var(--verde);
      font-size: clamp(38px, 10vw, 58px); line-height: .9; letter-spacing: .5px;
    }
    .lista { display: grid; gap: 22px; }
    .linha {
      position: relative; display: grid; grid-template-columns: 56px 1fr 64px; align-items: center;
      height: 50px; background: var(--faixa); border-radius: 999px; color: #fff;
      box-shadow: 0 4px 12px rgba(18, 38, 27, .16);
    }
    .primeira .linha { opacity: 0; animation: entra .5s ease forwards; }
    @keyframes entra { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: none; } }
    .pos { font-family: 'Bebas Neue', sans-serif; font-size: 26px; text-align: center; opacity: .9; }
    .logo {
      position: absolute; left: 50px; top: 50%; transform: translateY(-50%);
      width: 74px; height: 74px; border-radius: 50%; background: #fff; object-fit: contain;
    }
    .sig {
      padding-left: 70px; text-align: center; font-weight: 500; font-size: clamp(24px, 7vw, 34px);
      letter-spacing: 1.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .pt {
      justify-self: end; margin-right: -6px; width: 58px; height: 58px; border-radius: 50%;
      background: var(--circulo); display: grid; place-items: center; font-weight: 600; font-size: 19px;
      font-variant-numeric: tabular-nums; box-shadow: 0 2px 8px rgba(0, 0, 0, .25);
    }
    .linha.sobe .pt { animation: pisca 1.6s ease 2; }
    @keyframes pisca { 50% { background: var(--ouro); color: var(--tinta); } }
    .rodape { margin-top: 30px; text-align: center; font-size: 13px; color: var(--suave); }
    .rodape a { color: var(--verde); font-weight: 700; text-decoration: none; }
    .aviso { text-align: center; padding: 40px 16px; color: var(--suave); }
    .aviso b { display: block; font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 30px; color: var(--verde); }
    .oculto { display: none !important; }
    .aviso-con {
      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 50;
      background: var(--tinta); color: #fff; padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
    }
    @media (max-width: 420px) {
      .linha { grid-template-columns: 40px 1fr 54px; height: 44px; }
      .logo { left: 36px; width: 62px; height: 62px; }
      .sig { padding-left: 60px; }
      .pt { width: 50px; height: 50px; font-size: 17px; }
      .lista { gap: 18px; }
    }
    @media (prefers-reduced-motion: reduce) { .primeira .linha { animation: none; opacity: 1; } .linha.sobe .pt { animation: none; } }
  </style>
</head>
<body>
  <main>
    <header class="cab">
      <svg viewBox="0 0 48 48" fill="currentColor" stroke="#b07a12" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 6h18v10a9 9 0 0 1-18 0z"/><path fill="none" stroke="currentColor" stroke-width="2.8" d="M15 9H8c0 6 3 9 7 9M33 9h7c0 6-3 9-7 9"/><path d="M22 25h4v8h-4zM19 33h10l2 9H17z"/>
      </svg>
      <h1>Classificação Geral</h1>
    </header>
    <div id="tabela"><p class="aviso">Carregando…</p></div>
    <p class="rodape">Atualiza sozinha · <a href="/#/geral">Detalhes e pódios</a> · <a href="/">Site dos Jogos</a></p>
  </main>

  <script src="/js/regras.js"></script>
  <script src="/js/comum.js"></script>
  <script>
    (() => {
      const el = document.getElementById('tabela');
      const { esc } = Itec;
      let anterior = null; // pontos da última renderização, para destacar quem subiu
      Itec.aoMudar(s => {
        if (s.evento && s.evento.mostrarGeral === false) {
          el.innerHTML = '<div class="aviso"><b>Classificação em breve</b>A organização ainda não divulgou a classificação geral.</div>';
          return;
        }
        const r = Regras.classificacaoGeral(s);
        el.innerHTML = `<div class="lista ${anterior ? '' : 'primeira'}">${r.map((e, i) => {
          const subiu = anterior && anterior[e.id] !== undefined && e.pts > anterior[e.id];
          return `<div class="linha ${subiu ? 'sobe' : ''}" style="animation-delay:${i * 60}ms">
            <span class="pos">${i + 1}</span>
            <img class="logo" src="${esc(e.logo)}" alt="">
            <span class="sig">${esc(e.sigla)}</span>
            <span class="pt">${String(e.pts).replace('.', ',')}</span>
          </div>`;
        }).join('')}</div>`;
        anterior = Object.fromEntries(r.map(e => [e.id, e.pts]));
      });
      Itec.sincronizar();
    })();
  </script>
</body>
</html>
